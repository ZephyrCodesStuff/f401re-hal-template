name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build & Lint (Single Runner)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Cache STM32Cube Toolchain Bundles
        id: cache-stm32cube
        uses: actions/cache@v4
        with:
          path: |
            ~/.stm32cube
            ~/.local/share/stm32cube
          key: stm32cube-bundles-${{ runner.os }}-${{ hashFiles('.settings/bundles-lock.store.json') }}
          restore-keys: |
            stm32cube-bundles-${{ runner.os }}-

      - name: Install STM32CubeCLI and Toolchain Bundles
        run: |
          curl -fsSL https://developer.st.com/bundles/install/install.sh | bash -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.stm32cube/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$HOME/.stm32cube/bin:$PATH"
          cube bundle install --project

          # Export discovered toolchain binary directories to GITHUB_PATH
          for tool_bin in $(find "$HOME/.stm32cube/bundles" "$HOME/.local/share/stm32cube/bundles" -type d -name "bin" 2>/dev/null); do
            echo "$tool_bin" >> $GITHUB_PATH
          done

      - name: Verify Toolchain
        run: |
          echo "=== Compiler ==="
          which starm-clang && starm-clang --version || true
          echo "=== Clang-Tidy ==="
          clang-tidy --version
          echo "=== Just ==="
          just --version

      - name: Build STM32F401RE (Debug)
        run: just target=f401 build_type=Debug build

      - name: Lint STM32F401RE (clang-tidy)
        run: just target=f401 build_type=Debug tidy

      - name: Build STM32G491RE (Debug)
        run: just target=g491 build_type=Debug build

      - name: Lint STM32G491RE (clang-tidy)
        run: just target=g491 build_type=Debug tidy

      - name: Firmware Memory Footprint
        run: |
          echo "=== STM32F401RE Memory Usage ==="
          just target=f401 size
          echo "=== STM32G491RE Memory Usage ==="
          just target=g491 size
